name: Agentic SDLC — PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write

jobs:
  review:
    if: |
      github.event.action != 'labeled' ||
      github.event.label.name == 'agent:review'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENCODE_BASE_URL: ${{ secrets.OPENCODE_BASE_URL }}
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      OPENCODE_MODEL: ${{ vars.OPENCODE_MODEL || 'deepseek-v4-flash-free' }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_OWNER: ${{ github.repository_owner }}
      GITHUB_REPOSITORY: ${{ github.event.repository.name }}

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run framework self-tests
        run: pytest tests/unit -q --tb=short

      - name: Generate task spec from PR
        id: task
        run: |
          cat > /tmp/pr-task.yaml << 'TASKEOF'
          execution_id: pr-${{ github.event.pull_request.number }}-${{ github.run_id }}
          title: "${{ github.event.pull_request.title }}"
          description: "${{ github.event.pull_request.body }}"
          repository_path: "${{ github.workspace }}"
          base_branch: ${{ github.event.pull_request.base.ref }}
          acceptance_criteria: []
          requested_agents:
            - repo_inspector
            - test_pyramid
            - security
            - code_quality
            - lint
            - docker
          mode: dry_run
          metadata:
            pr_number: ${{ github.event.pull_request.number }}
            pr_url: "${{ github.event.pull_request.html_url }}"
            pr_branch: "${{ github.event.pull_request.head.ref }}"
            pr_author: "${{ github.event.pull_request.user.login }}"
          TASKEOF
          echo "task=/tmp/pr-task.yaml" >> "$GITHUB_OUTPUT"

      - name: Run orchestrator on PR
        id: sdlc
        run: |
          python -m orchestrator.engine \
            --task /tmp/pr-task.yaml \
            --mode dry_run \
            --no-opencode

      - name: Find reports
        id: reports
        if: always()
        run: |
          echo "files=$(find data/executions -name report.json -type f | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      - name: Post PR comment
        if: always() && steps.reports.outputs.files != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const files = '${{ steps.reports.outputs.files }}'.trim().split(/\s+/).filter(Boolean);
            let body = '## 🤖 Agentic SDLC Review\n\n';

            for (const file of files) {
              if (!fs.existsSync(file)) continue;
              const report = JSON.parse(fs.readFileSync(file, 'utf8'));
              const verdict = report.verdict || 'UNKNOWN';
              const verdictIcon = {PASS: '✅', PASS_WITH_WARNINGS: '⚠️', BLOCKED: '🚫', REQUIRES_HUMAN_APPROVAL: '👤'}[verdict] || '❓';
              body += `### ${verdictIcon} Verdict: ${verdict}\n`;
              body += `**Execution ID:** \`${report.execution_id}\`\n`;
              body += `**Duration:** ${(report.total_duration_ms / 1000).toFixed(1)}s\n\n`;
              body += '**Agent Results:**\n';
              for (const a of report.agent_results || []) {
                body += `- ${a.status === 'SUCCESS' ? '✅' : '❌'} **${a.agent_name}** (${a.duration_ms.toFixed(0)}ms)\n`;
              }
              if (report.warnings && report.warnings.length) {
                body += '\n**Warnings:**\n';
                for (const w of report.warnings.slice(0, 5)) body += `- ⚠️ ${w}\n`;
              }
              if (report.findings && report.findings.length) {
                body += '\n**Findings:**\n';
                for (const f of report.findings.slice(0, 8)) body += `- ${f}\n`;
              }
            }

            body += '\n---\n_Generated by [Agentic SDLC](https://github.com/lorenzogirardi/agentic-sdlc)_';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });

      - name: Set check status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const files = '${{ steps.reports.outputs.files }}'.trim().split(/\s+/).filter(Boolean);

            let conclusion = 'neutral';
            let summary = 'No report found';

            for (const file of files) {
              if (!fs.existsSync(file)) continue;
              const report = JSON.parse(fs.readFileSync(file, 'utf8'));
              const verdict = report.verdict;
              if (verdict === 'BLOCKED') conclusion = 'failure';
              else if (verdict === 'PASS_WITH_WARNINGS' && conclusion !== 'failure') conclusion = 'neutral';
              else if (verdict === 'PASS' && conclusion === 'neutral') conclusion = 'success';
              summary = `Verdict: ${verdict} — ${report.summary || ''}`;
            }

            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'Agentic SDLC Review',
              head_sha: context.payload.pull_request.head.sha,
              status: 'completed',
              conclusion: conclusion,
              output: {
                title: 'Agentic SDLC',
                summary: summary
              }
            });

      - name: Block merge if BLOCKED
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const files = '${{ steps.reports.outputs.files }}'.trim().split(/\s+/).filter(Boolean);

            for (const file of files) {
              if (!fs.existsSync(file)) continue;
              const report = JSON.parse(fs.readFileSync(file, 'utf8'));
              if (report.verdict === 'BLOCKED') {
                core.setFailed(`Merge blocked: verdict ${report.verdict}`);
                return;
              }
            }