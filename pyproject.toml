[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-sdlc"
version = "0.1.0"
description = "Agentic SDLC Platform — Automated specification, implementation, verification, and review pipeline driven by Trello cards"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [{name = "SLDC Team"}]

dependencies = [
    "pydantic>=2.10",
    "httpx>=0.28",
    "openai>=1.58",
    "pyyaml>=6.0",
    "structlog>=24.4",
    "opentelemetry-api>=1.28",
    "opentelemetry-sdk>=1.28",
    "opentelemetry-exporter-otlp>=1.28",
    "prometheus_client>=0.21",
    "aiofiles>=24.1",
    "langgraph>=0.2",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
    "pytest-cov>=6.0",
    "hypothesis>=6.122",
    "ruff>=0.8",
    "mypy>=1.13",
    "coverage>=7.6",
    "types-PyYAML>=6.0",
]

[tool.setuptools.packages.find]
include = ["orchestrator*", "agents*", "integrations*", "runners*", "schemas*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "C4"]
exclude = ["examples/sample-service/app.py"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
strict = true
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "agents.*"
disallow_any_generics = false

[[tool.mypy.overrides]]
module = "integrations.*"
disallow_any_generics = false

[[tool.mypy.overrides]]
module = "orchestrator.*"
disallow_any_generics = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["orchestrator", "agents", "integrations", "runners", "schemas"]
omit = ["tests/*", "examples/*"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "raise NotImplementedError",
]