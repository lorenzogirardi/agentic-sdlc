name: Agentic SDLC Run

# B-001-035 — LangGraph-driven agent pipeline as a GitHub Actions alternative
# to the local Docker execution path (same orchestrator.engine module either
# way; only the launch mechanism differs). Triggered either by the Trello
# webhook's repository_dispatch (orchestrator/github_dispatch.py) or manually.
on:
  repository_dispatch:
    types: [trello-card]
  workflow_dispatch:
    inputs:
      task_json:
        description: "TaskSpec JSON (same shape as a repository_dispatch client_payload)"
        required: true

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  run-agents:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install agentic-sdlc
        run: pip install -e ".[dev]"

      - name: Write task spec from dispatch payload
        env:
          TASK_JSON: >-
            ${{ github.event_name == 'workflow_dispatch'
                && github.event.inputs.task_json
                || toJson(github.event.client_payload) }}
        run: |
          python - <<'PY'
          import json
          import os

          import yaml

          task = json.loads(os.environ["TASK_JSON"])
          task.setdefault("mode", "pr")
          with open("ci-task.yaml", "w") as f:
              yaml.safe_dump(task, f)
          PY

      - name: Run agentic pipeline (LangGraph-driven)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENCODE_BASE_URL: ${{ secrets.OPENCODE_BASE_URL }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_MODEL: ${{ vars.OPENCODE_MODEL }}
        run: python -m orchestrator.engine --task ci-task.yaml --mode pr

      - name: Open PR for agent changes
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            BRANCH="agentic/${{ github.run_id }}"
            git checkout -b "$BRANCH"
            git config user.name "agentic-sdlc[bot]"
            git config user.email "agentic-sdlc[bot]@users.noreply.github.com"
            git add -A
            git commit -m "agentic: automated changes (run ${{ github.run_id }})"
            git push origin "$BRANCH"
            PR_URL=$(gh pr create \
              --title "Agentic SDLC run ${{ github.run_id }}" \
              --body "Automated changes from the agentic pipeline (execution report in workflow logs)." \
              --head "$BRANCH")
            echo "url=$PR_URL" >> "$GITHUB_OUTPUT"
          else
            echo "No changes produced by agents — skipping PR."
            echo "url=" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push fractal sample-service image
        uses: docker/build-push-action@v6
        with:
          context: examples/sample-service
          file: examples/sample-service/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-fractal:${{ github.sha }}
            ghcr.io/${{ github.repository }}-fractal:latest

      - name: Update Trello card with result
        if: always()
        env:
          TRELLO_API_KEY: ${{ secrets.TRELLO_API_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
          PR_URL: ${{ steps.pr.outputs.url }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          IMAGE_TAG: ghcr.io/${{ github.repository }}-fractal:${{ github.sha }}
        run: |
          python - <<'PY'
          import glob
          import json
          import os

          import httpx
          import yaml

          key = os.environ["TRELLO_API_KEY"]
          token = os.environ["TRELLO_TOKEN"]
          pr_url = os.environ.get("PR_URL", "")
          run_url = os.environ["RUN_URL"]
          image_tag = os.environ["IMAGE_TAG"]

          with open("ci-task.yaml") as f:
              task = yaml.safe_load(f)
          card_id = task.get("metadata", {}).get("trello_card_id")
          if not card_id:
              print("no trello_card_id in task spec — skipping card update")
              raise SystemExit(0)

          reports = glob.glob("data/executions/*/report.json")
          verdict = "UNKNOWN"
          summary = ""
          if reports:
              with open(reports[0]) as f:
                  report = json.load(f)
              verdict = report.get("verdict", "UNKNOWN")
              summary = report.get("summary", "")

          prefix = {
              "PASS": "PASS",
              "PASS_WITH_WARNINGS": "PASS*",
              "BLOCKED": "BLOCKED",
              "REQUIRES_HUMAN_APPROVAL": "REVIEW",
          }.get(verdict, verdict)

          lines = [f"## Agentic SDLC Run — {verdict}", "", f"**Run:** {run_url}"]
          if pr_url:
              lines.append(f"**PR:** {pr_url}")
          lines.append(f"**Image:** `{image_tag}`")
          if summary:
              lines += ["", summary]
          comment = "\n".join(lines)

          base = "https://api.trello.com/1"
          params = {"key": key, "token": token}

          httpx.post(
              f"{base}/cards/{card_id}/actions/comments",
              params=params,
              data={"text": comment},
              timeout=30,
          )
          httpx.put(
              f"{base}/cards/{card_id}",
              params=params,
              data={"name": f"[{prefix}] " + task.get("title", "")},
              timeout=30,
          )
          print(f"Trello card {card_id} updated: {verdict}")
          PY
