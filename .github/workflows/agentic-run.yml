name: Agentic SDLC Run

# B-001-035 — LangGraph-driven agent pipeline as a GitHub Actions alternative
# to the local Docker execution path (same orchestrator.engine module either
# way; only the launch mechanism differs). Triggered either by the Trello
# webhook's repository_dispatch (orchestrator/github_dispatch.py) or manually.
on:
  repository_dispatch:
    types: [trello-card]
  workflow_dispatch:
    inputs:
      task_json:
        description: "TaskSpec JSON (same shape as a repository_dispatch client_payload)"
        required: true

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  run-agents:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agentic-sdlc
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install agentic-sdlc
        run: pip install -e ".[dev]"

      - name: Write task spec from dispatch payload
        env:
          TASK_JSON: >-
            ${{ github.event_name == 'workflow_dispatch'
                && github.event.inputs.task_json
                || toJson(github.event.client_payload) }}
        run: |
          python - <<'PY'
          import json
          import os

          import yaml

          task = json.loads(os.environ["TASK_JSON"])
          task.setdefault("mode", "pr")
          with open("ci-task.yaml", "w") as f:
              yaml.safe_dump(task, f)
          PY

      - name: Run agentic pipeline (LangGraph-driven)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENCODE_BASE_URL: ${{ secrets.OPENCODE_BASE_URL }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: python -m orchestrator.engine --task ci-task.yaml --mode pr

      - name: Open PR for agent changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            BRANCH="agentic/${{ github.run_id }}"
            git checkout -b "$BRANCH"
            git config user.name "agentic-sdlc[bot]"
            git config user.email "agentic-sdlc[bot]@users.noreply.github.com"
            git add -A
            git commit -m "agentic: automated changes (run ${{ github.run_id }})"
            git push origin "$BRANCH"
            gh pr create \
              --title "Agentic SDLC run ${{ github.run_id }}" \
              --body "Automated changes from the agentic pipeline (execution report in workflow logs)." \
              --head "$BRANCH"
          else
            echo "No changes produced by agents — skipping PR."
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push fractal sample-service image
        uses: docker/build-push-action@v6
        with:
          context: agentic-sdlc/examples/sample-service
          file: agentic-sdlc/examples/sample-service/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-fractal:${{ github.sha }}
            ghcr.io/${{ github.repository }}-fractal:latest
