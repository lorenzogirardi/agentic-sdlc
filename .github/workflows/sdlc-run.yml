name: Agentic SDLC — Trello Poll

on:
  workflow_dispatch:
    inputs:
      poll_once:
        description: "Single poll pass (no loop)"
        type: boolean
        default: true
      mode:
        description: "Execution mode"
        type: choice
        options: [dry_run, pr, approval_required]
        default: pr
  # schedule trigger disabled until TRELLO_* secrets are configured on this
  # repo (Settings → Secrets and variables → Actions) — was firing every 15
  # min and failing on trello_missing_config. Re-enable once secrets are set:
  # schedule:
  #   - cron: "*/15 * * * *"

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: sdlc-trello-${{ github.ref }}
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENCODE_BASE_URL: ${{ secrets.OPENCODE_BASE_URL }}
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      OPENCODE_MODEL: ${{ vars.OPENCODE_MODEL || 'deepseek-v4-flash-free' }}
      TRELLO_API_KEY: ${{ secrets.TRELLO_API_KEY }}
      TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
      TRELLO_BOARD_ID: ${{ vars.TRELLO_BOARD_ID }}
      TRELLO_RUN_LABEL_ID: ${{ vars.TRELLO_RUN_LABEL_ID }}
      TRELLO_TODO_LIST_ID: ${{ vars.TRELLO_TODO_LIST_ID }}
      TRELLO_IN_PROGRESS_LIST_ID: ${{ vars.TRELLO_IN_PROGRESS_LIST_ID }}
      TRELLO_DONE_LIST_ID: ${{ vars.TRELLO_DONE_LIST_ID }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_OWNER: ${{ github.repository_owner }}
      GITHUB_REPOSITORY: ${{ github.event.repository.name }}
      TARGET_REPO_PATH: ${{ github.workspace }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]" && pip install python-dotenv

      - name: Run framework tests
        run: pytest tests/unit -q --tb=short

      - name: Poll Trello and execute
        env:
          POLL_ONCE: ${{ inputs.poll_once != 'false' && '--poll-interval 0' || '' }}
        run: |
          python -m orchestrator.engine \
            --poll-trello \
            --mode ${{ inputs.mode || 'pr' }} \
            $POLL_ONCE

      - name: Upload execution reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdlc-reports-${{ github.run_id }}
          path: data/executions/
          retention-days: 30
          if-no-files-found: ignore

      - name: Job summary
        if: always()
        run: |
          echo "## Agentic SDLC — Trello Poll" >> "$GITHUB_STEP_SUMMARY"
          echo "**Run ID:** ${{ github.run_id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Mode:** ${{ inputs.mode || 'pr' }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -d data/executions ]; then
            for report in data/executions/*/report.json; do
              [ -f "$report" ] || continue
              verdict=$(python -c "import json; print(json.load(open('$report')).get('verdict','?'))")
              echo "- $(dirname $report | xargs basename): **$verdict**" >> "$GITHUB_STEP_SUMMARY"
            done
          fi