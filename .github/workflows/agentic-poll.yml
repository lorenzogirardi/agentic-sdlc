name: Agentic SDLC Trello Poll

# Cron-driven alternative to the local `--poll-trello` loop: runs one poll
# pass per tick entirely inside GitHub Actions, so no local machine (webhook
# server, ngrok tunnel, docker compose) needs to be running for a Trello card
# labelled agent:run to be picked up and turned into a PR + image.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  packages: write

concurrency:
  group: agentic-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install agentic-sdlc
        run: pip install -e ".[dev]"

      - name: Poll Trello once and run any labelled cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_OWNER: ${{ github.repository_owner }}
          GITHUB_REPOSITORY: ${{ github.event.repository.name }}
          OPENCODE_BASE_URL: ${{ secrets.OPENCODE_BASE_URL }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_MODEL: ${{ vars.OPENCODE_MODEL }}
          TRELLO_API_KEY: ${{ secrets.TRELLO_API_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
          TRELLO_BOARD_ID: ${{ vars.TRELLO_BOARD_ID }}
          TRELLO_RUN_LABEL_ID: ${{ vars.TRELLO_RUN_LABEL_ID }}
          TRELLO_IN_PROGRESS_LIST_ID: ${{ vars.TRELLO_IN_PROGRESS_LIST_ID }}
          TRELLO_DONE_LIST_ID: ${{ vars.TRELLO_DONE_LIST_ID }}
          TRELLO_TODO_LIST_ID: ${{ vars.TRELLO_TODO_LIST_ID }}
          TARGET_REPO_PATH: .
        run: python -m orchestrator.engine --poll-trello --poll-interval 0 --mode pr

      - name: Log in to GHCR
        if: always()
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push fractal sample-service image (if changed)
        if: always()
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: examples/sample-service
          file: examples/sample-service/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-fractal:${{ github.sha }}
            ghcr.io/${{ github.repository }}-fractal:latest
